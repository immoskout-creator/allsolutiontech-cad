# Instaluesit e Windows (.exe), një për çdo program.
# Pas çdo ndryshimi në main, instaluesit dalin te faqja "Releases" e depos, me emrin "Programet për Windows".
name: Windows

on:
  push:
    branches: [main]
  pull_request:
    paths: ['desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [civil, cctv, network, fire, emergency, all]
    env:
      APP_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - run: node build-installers.mjs --edition ${{ matrix.edition }}
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.edition }}
          path: desktop/release/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publiko instaluesit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=windows-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" installers/*.exe --target "$GITHUB_SHA" \
            --title "Programet për Windows (0.1.${{ github.run_number }})" \
            --notes "Instaluesit e gjashtë programeve AllSolutionTech CAD. Shkarko .exe e programit që të duhet dhe hape. Windows mund të shfaqë një paralajmërim (SmartScreen) sepse instaluesit ende nuk janë të nënshkruar: kliko \"More info\" dhe pastaj \"Run anyway\"."
