<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">AST</div>
      <div class="brand-text">
        <span class="brand-name">AllSolutionTech CAD Electrical</span>
        <span class="brand-sub" data-i18n="brandSub"></span>
      </div>
    </div>
    <div class="doc-name"><span data-i18n="project"></span>: <strong id="docName"></strong></div>
    <div class="actions">
      <label class="lang" for="langSelect">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"></path></svg>
        <span class="sr-only" data-i18n="language"></span>
        <select id="langSelect"></select>
      </label>
      <button class="btn" id="btnNew" type="button">
        <svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M12 9v6M9 12h6"></path></svg><span data-i18n="new"></span>
      </button>
      <button class="btn" id="btnOpen" type="button">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"></path></svg><span data-i18n="open"></span>
      </button>
      <button class="btn" id="btnReports" type="button" data-i18n-title="reportsTitle">
        <svg class="ic" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 11h7M9 15h7M9 7h3"></path></svg><span data-i18n="reports"></span>
      </button>
      <button class="btn btn-primary" id="btnSave" type="button" data-i18n-title="saveTitle">
        <svg class="ic" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"></path><path d="M8 3v6h8V3"></path><path d="M8 21v-7h8v7"></path></svg><span data-i18n="save"></span>
      </button>
      <input type="file" id="fileInput" accept=".json,.astcad,application/json" hidden>
    </div>
  </header>

  <div class="toolbar" role="toolbar" data-i18n-aria="toolbar">
    <div class="group">
      <button class="tool" data-tool="select" type="button" data-i18n-title="selectTitle">
        <svg class="ic" viewBox="0 0 24 24"><path d="M5 3l6 16 2-7 7-2z"></path></svg><span data-i18n="select"></span>
      </button>
      <button class="tool" data-tool="wall" type="button" data-i18n-title="wallTitle">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6"></rect><path d="M7 9v6M11 9v6M15 9v6M19 9v6"></path></svg><span data-i18n="wall"></span>
      </button>
      <button class="tool" data-tool="door" type="button" data-i18n-title="doorTitle">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 20h4M17 20h4"></path><path d="M7 20V6"></path><path d="M7 6a14 14 0 0 1 14 14" stroke-dasharray="2.5 2"></path></svg><span data-i18n="door"></span>
      </button>
      <button class="tool" data-tool="window" type="button" data-i18n-title="windowTitle">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6"></rect><path d="M3 12h18"></path></svg><span data-i18n="window"></span>
      </button>
      <button class="tool" data-tool="room" type="button" data-i18n-title="roomTitle">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"></rect><path d="M8 13h3M8 10h8"></path><path d="M14 15.5h1.5a1 1 0 0 0 0-2H14v4h2" stroke-width="1.4"></path></svg><span data-i18n="room"></span>
      </button>
      <button class="tool" data-tool="cable" type="button" data-i18n-title="cableTitle">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="4.5" cy="18" r="1.8"></circle><circle cx="19.5" cy="6" r="1.8"></circle><path d="M6.3 18H11V6h6.7"></path></svg><span data-i18n="cable"></span>
      </button>
      <button class="tool" data-tool="pan" type="button" data-i18n-title="panTitle">
        <svg class="ic" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"></path><path d="M11 11.5v-7a1.5 1.5 0 0 1 3 0V12"></path><path d="M14 6.5a1.5 1.5 0 0 1 3 0V13"></path><path d="M17 9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-5-2.7L4.3 14a1.6 1.6 0 0 1 2.6-1.8L8 13.5"></path></svg><span data-i18n="pan"></span>
      </button>
    </div>
    <div class="sep" aria-hidden="true"></div>
    <div class="group">
      <button class="tool" id="btnUndo" type="button" title="Ctrl+Z">
        <svg class="ic" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg><span data-i18n="undo"></span>
      </button>
      <button class="tool" id="btnRedo" type="button" title="Ctrl+Y">
        <svg class="ic" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"></path><path d="M20 9H10a6 6 0 0 0 0 12h3"></path></svg><span data-i18n="redo"></span>
      </button>
      <button class="tool" id="btnDelete" type="button" title="Delete">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16"></path><path d="M10 11v6M14 11v6"></path><path d="M6 7l1 13h10l1-13"></path><path d="M9 7V4h6v3"></path></svg><span data-i18n="delete"></span>
      </button>
    </div>
    <div class="sep" aria-hidden="true"></div>
    <div class="group">
      <button class="tool" id="btnFit" type="button" data-i18n-title="fitTitle">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"></path></svg><span data-i18n="fit"></span>
      </button>
    </div>
    <div class="spacer"></div>
    <div class="group settings">
      <label class="field-inline" for="sheetScale"><span data-i18n="sheetScaleLabel"></span>
        <select id="sheetScale"></select>
      </label>
      <div class="field-inline opening-size" id="openingWidthField" hidden>
        <label for="openingWidth"><span data-i18n="openingWidth"></span></label>
        <input id="openingWidth" class="num" type="number" min="30" max="600" step="5" list="openingWidthList">
        <label for="openingHeight"><span data-i18n="openingHeight"></span></label>
        <input id="openingHeight" class="num" type="number" min="30" max="600" step="5" list="openingHeightList">
        <span class="unit">cm</span>
        <datalist id="openingWidthList"></datalist>
        <datalist id="openingHeightList"></datalist>
      </div>
      <label class="field-inline" for="wallThickness" id="wallThicknessField"><span data-i18n="thickness"></span>
        <select id="wallThickness">
          <option value="100">10 cm</option>
          <option value="120">12 cm</option>
          <option value="150">15 cm</option>
          <option value="200">20 cm</option>
          <option value="250" selected>25 cm</option>
          <option value="300">30 cm</option>
        </select>
      </label>
      <button class="chip" id="chipSnap" type="button" aria-pressed="true" data-i18n-title="snapTitle">Snap</button>
      <button class="chip" id="chipGrid" type="button" aria-pressed="true" data-i18n-title="gridTitle" data-i18n="grid"></button>
      <button class="chip" id="chipOrtho" type="button" aria-pressed="false" data-i18n-title="orthoTitle">Orto</button>
      <button class="chip library-toggle" id="btnLibrary" type="button" aria-expanded="false" aria-controls="library" data-i18n="libraries"></button>
      <button class="chip panels-toggle" id="btnPanels" type="button" aria-expanded="false" aria-controls="side" data-i18n="panels"></button>
    </div>
  </div>

  <div class="main">
    <aside class="library" id="library" data-i18n-aria="libraries">
      <div class="lib-head">
        <h2 class="panel-title" data-i18n="libraries"></h2>
        <span class="lib-std">IEC 60617</span>
      </div>
      <ul class="lib-list" id="libList"></ul>
      <div class="volt-bar" id="voltBar" role="group" data-i18n-aria="phases" hidden></div>
      <div class="lib-actions">
        <button class="btn btn-small" id="btnNewSymbol" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg><span data-i18n="newSymbol"></span></button>
        <button class="btn btn-small" id="btnImportLib" type="button" data-i18n-title="importLibTitle" data-i18n="importLib"></button>
        <button class="btn btn-small" id="btnExportLib" type="button" data-i18n-title="exportLibTitle" data-i18n="exportLib"></button>
        <input type="file" id="libInput" accept=".json,application/json" hidden>
      </div>
      <label class="search" for="symbolSearch">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
        <input id="symbolSearch" type="search" data-i18n-placeholder="searchSymbol" data-i18n-aria="searchSymbol">
      </label>
      <div id="symbolGroups" class="symbol-groups"></div>
      <p class="muted small" data-i18n="libraryHelp"></p>
    </aside>

    <section class="stage" data-i18n-aria="canvasLabel">
      <canvas id="canvas" tabindex="0" data-i18n-aria="canvasLabel"></canvas>
      <div class="hint" id="hint" hidden></div>
      <div class="zoom">
        <button type="button" id="btnZoomIn" data-i18n-aria="zoomIn">+</button>
        <button type="button" id="btnZoomOut" data-i18n-aria="zoomOut">−</button>
      </div>
    </section>

    <aside class="side" id="side" data-i18n-aria="properties">
      <section class="panel">
        <h2 class="panel-title" data-i18n="properties"></h2>
        <div id="props"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title" data-i18n="circuits"></h2>
          <div class="panel-actions">
            <button class="btn btn-small" id="btnCircuitTable" type="button" data-i18n="circuitTable"></button>
            <button class="btn btn-small" id="btnNewCircuit" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg><span data-i18n="newCircuit"></span></button>
          </div>
        </div>
        <div id="circuitList"></div>
      </section>
      <section class="panel">
        <h2 class="panel-title" data-i18n="inPlan"></h2>
        <div id="symbolSummary"></div>
      </section>
      <section class="panel">
        <h2 class="panel-title" data-i18n="rooms"></h2>
        <div id="roomSummary"></div>
      </section>
      <section class="panel">
        <h2 class="panel-title" data-i18n="layers"></h2>
        <ul class="layers" id="layers"></ul>
      </section>
      <section class="panel">
        <h2 class="panel-title" data-i18n="shortcuts"></h2>
        <dl class="keys">
          <dt>W</dt><dd data-i18n="kWall"></dd>
          <dt>D / N</dt><dd data-i18n="kDoor"></dd>
          <dt>M</dt><dd data-i18n="kRoom"></dd>
          <dt>K</dt><dd data-i18n="kCable"></dd>
          <dt>V</dt><dd data-i18n="kSelect"></dd>
          <dt data-i18n="kTypedKey"></dt><dd data-i18n="kTyped"></dd>
          <dt>R</dt><dd data-i18n="kRotate"></dd>
          <dt>Shift</dt><dd data-i18n="kShift"></dd>
          <dt data-i18n="kEscKey"></dt><dd data-i18n="kEsc"></dd>
          <dt data-i18n="kWheelKey"></dt><dd data-i18n="kWheel"></dd>
          <dt data-i18n="kPanKey"></dt><dd data-i18n="kPan"></dd>
          <dt>Ctrl+Z / Ctrl+Y</dt><dd data-i18n="kUndo"></dd>
          <dt>Ctrl+S</dt><dd data-i18n="kSave"></dd>
        </dl>
      </section>
    </aside>
  </div>

  <footer class="status" aria-live="off">
    <span id="stCoords">X 0.00 m · Y 0.00 m</span>
    <span id="stSnap"></span>
    <span id="stZoom"></span>
    <span id="stInfo" class="status-info"></span>
    <span id="stSaved" class="status-saved"></span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <div class="modal" id="symbolEditor" hidden>
    <div class="modal-box se-box" role="dialog" aria-modal="true" aria-labelledby="seTitle">
      <h2 id="seTitle"></h2>
      <div class="se-body">
        <div class="se-draw">
          <div class="se-tools" role="toolbar">
            <button class="chip" type="button" data-shape="line" data-i18n="seLine"></button>
            <button class="chip" type="button" data-shape="rect" data-i18n="seRect"></button>
            <button class="chip" type="button" data-shape="circle" data-i18n="seCircle"></button>
            <button class="chip" type="button" data-shape="arc" data-i18n="seArc"></button>
            <button class="chip" type="button" data-shape="text" data-i18n="seText"></button>
            <span class="se-sep" aria-hidden="true"></span>
            <button class="chip" type="button" id="seFill" aria-pressed="false" data-i18n="seFill" data-i18n-title="seFillTitle"></button>
            <button class="chip" type="button" id="seUndo" data-i18n="undo"></button>
            <button class="chip" type="button" id="seClear" data-i18n="seClear"></button>
          </div>
          <div class="se-text" id="seTextRow" hidden>
            <label class="field-inline" for="seText"><span data-i18n="seTextValue"></span><input id="seText" type="text" maxlength="8" value="M"></label>
            <label class="field-inline" for="seTextSize"><span data-i18n="seTextSize"></span>
              <select id="seTextSize"><option value="4">4</option><option value="6" selected>6</option><option value="8">8</option><option value="10">10</option></select>
            </label>
          </div>
          <canvas id="seCanvas"></canvas>
          <p class="muted small" id="seHint"></p>
        </div>
        <div class="se-form">
          <div class="se-preview" id="sePreview"></div>
          <div class="prop-grid">
            <label class="field" for="seCode"><span data-i18n="code"></span><input id="seCode" type="text" maxlength="16"></label>
            <label class="field" for="seMount"><span data-i18n="seMount"></span>
              <select id="seMount"><option value="wall" data-i18n="seMountWall"></option><option value="center" data-i18n="seMountCenter"></option></select>
            </label>
          </div>
          <label class="field" for="seLayer"><span data-i18n="layer"></span><select id="seLayer"></select></label>
          <label class="field" for="seName_sq"><span>Shqip</span><input id="seName_sq" type="text"></label>
          <label class="field" for="seName_en"><span>English</span><input id="seName_en" type="text"></label>
          <label class="field" for="seName_it"><span>Italiano</span><input id="seName_it" type="text"></label>
          <label class="field" for="seName_de"><span>Deutsch</span><input id="seName_de" type="text"></label>
          <p class="muted small" data-i18n="seNamesHelp"></p>
          <div class="prop-grid">
            <label class="field" for="seHeight"><span data-i18n="heightCm"></span><input id="seHeight" class="num" type="number" min="0"></label>
            <label class="field" for="sePower"><span data-i18n="powerW"></span><input id="sePower" class="num" type="number" min="0"></label>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn danger" id="seDelete" type="button" data-i18n="seDelete"></button>
        <span class="spacer"></span>
        <button class="btn" id="seCancel" type="button" data-i18n="cancel"></button>
        <button class="btn btn-primary" id="seSave" type="button" data-i18n="seSave"></button>
      </div>
    </div>
  </div>

  <div class="modal" id="reportsModal" hidden>
    <div class="modal-box modal-wide modal-report" role="dialog" aria-modal="true" aria-labelledby="reportsHeading">
      <h2 id="reportsHeading" data-i18n="reportsTitle"></h2>
      <div class="report-tabs" role="tablist">
        <button class="chip" type="button" role="tab" data-report="materials" data-i18n="tabMaterials"></button>
        <button class="chip" type="button" role="tab" data-report="legend" data-i18n="tabLegend"></button>
        <button class="chip" type="button" role="tab" data-report="catalog" data-i18n="tabCatalog"></button>
      </div>
      <iframe id="reportFrame" class="report-frame" title="Report"></iframe>
      <div class="modal-actions">
        <button class="btn" id="reportPrint" type="button" data-i18n="print"></button>
        <button class="btn" id="reportHtml" type="button" data-i18n="saveHtml"></button>
        <button class="btn" id="reportCsv" type="button" data-i18n="exportCsv"></button>
        <span class="spacer"></span>
        <button class="btn btn-primary" id="reportClose" type="button" data-i18n="closeCircuit"></button>
      </div>
    </div>
  </div>

  <div class="modal" id="circuitModal" hidden>
    <div class="modal-box modal-wide" role="dialog" aria-modal="true" aria-labelledby="circuitModalTitle">
      <h2 id="circuitModalTitle" data-i18n="circuitTableTitle"></h2>
      <div class="table-scroll" id="circuitTableBody"></div>
      <p class="muted small" data-i18n="calcNote"></p>
      <div class="modal-actions">
        <button class="btn" id="circuitCsv" type="button" data-i18n="exportCsv"></button>
        <span class="spacer"></span>
        <button class="btn btn-primary" id="circuitModalClose" type="button" data-i18n="closeCircuit"></button>
      </div>
    </div>
  </div>

  <div class="modal" id="confirmNew" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle" data-i18n="newTitle"></h2>
      <p data-i18n="newText"></p>
      <label class="field" for="newName"><span data-i18n="projectName"></span>
        <input id="newName" type="text">
      </label>
      <div class="modal-actions">
        <button class="btn" id="confirmSample" type="button" data-i18n="openSample"></button>
        <span class="spacer"></span>
        <button class="btn" id="confirmCancel" type="button" data-i18n="cancel"></button>
        <button class="btn btn-primary" id="confirmOk" type="button" data-i18n="create"></button>
      </div>
    </div>
  </div>
</div>
